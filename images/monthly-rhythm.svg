<svg viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <!-- baseline -->
  <line x1="70" y1="140" x2="730" y2="140" stroke="#dcebe4" stroke-width="3" stroke-linecap="round"/>

  <!-- mini bars (progressively taller) -->
  <rect x="87" y="98" width="26" height="28" rx="5" fill="#0d7a5e" opacity="0.35"/>
  <rect x="207" y="84" width="26" height="42" rx="5" fill="#0d7a5e" opacity="0.5"/>
  <rect x="327" y="70" width="26" height="56" rx="5" fill="#0d7a5e" opacity="0.65"/>
  <rect x="447" y="56" width="26" height="70" rx="5" fill="#0d7a5e" opacity="0.8"/>
  <rect x="567" y="42" width="26" height="84" rx="5" fill="#0d7a5e"/>
  <rect x="687" y="26" width="26" height="100" rx="5" fill="#f0b429"/>

  <!-- check-tile above the last bar -->
  <rect x="690" y="2" width="20" height="20" rx="6" fill="#0d7a5e"/>
  <path d="M694.5 12 L698.5 16 L705.5 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- timeline dots -->
  <circle cx="100" cy="140" r="6" fill="#0d7a5e"/>
  <circle cx="220" cy="140" r="6" fill="#0d7a5e"/>
  <circle cx="340" cy="140" r="6" fill="#0d7a5e"/>
  <circle cx="460" cy="140" r="6" fill="#0d7a5e"/>
  <circle cx="580" cy="140" r="6" fill="#0d7a5e"/>
  <circle cx="700" cy="140" r="6" fill="#0a5c47"/>

  <!-- month labels -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#13221d" text-anchor="middle">
    <text x="100" y="166">Jan</text>
    <text x="220" y="166">Feb</text>
    <text x="340" y="166">Mar</text>
    <text x="460" y="166">Apr</text>
    <text x="580" y="166">May</text>
    <text x="700" y="166">Jun</text>
  </g>
</svg>
