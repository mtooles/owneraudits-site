<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background halo -->
  <circle cx="450" cy="280" r="215" fill="#f4faf7"/>

  <!-- decorative dots -->
  <circle cx="250" cy="58" r="4" fill="#dcebe4"/>
  <circle cx="652" cy="514" r="4" fill="#dcebe4"/>
  <circle cx="66" cy="330" r="3" fill="#dcebe4"/>
  <circle cx="838" cy="190" r="3.5" fill="#f0b429" opacity="0.9"/>

  <!-- dashed connectors (sage) -->
  <g fill="none" stroke="#dcebe4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 9">
    <path d="M192 114 C254 114 254 205 316 205"/>
    <path d="M708 114 C646 114 646 205 584 205"/>
    <path d="M192 446 C254 446 254 355 316 355"/>
    <path d="M708 446 C646 446 646 355 584 355"/>
  </g>

  <!-- agent tile: dollar (top-left) -->
  <rect x="100" y="78" width="88" height="88" rx="22" fill="#13221d" opacity="0.10" filter="url(#soft)"/>
  <rect x="100" y="70" width="88" height="88" rx="22" fill="#0d7a5e"/>
  <g transform="translate(144,114)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -19 V19"/>
    <path d="M9 -11 C9 -17 -9 -17 -9 -10 C-9 -3 9 -4 9 4 C9 11 -9 11 -9 5"/>
  </g>

  <!-- agent tile: funnel (top-right) -->
  <rect x="712" y="78" width="88" height="88" rx="22" fill="#13221d" opacity="0.10" filter="url(#soft)"/>
  <rect x="712" y="70" width="88" height="88" rx="22" fill="#0a5c47"/>
  <g transform="translate(756,114)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-15 -13 H15 L5 1 V14 L-5 9 V1 Z"/>
  </g>

  <!-- agent tile: envelope (bottom-left) -->
  <rect x="100" y="410" width="88" height="88" rx="22" fill="#13221d" opacity="0.10" filter="url(#soft)"/>
  <rect x="100" y="402" width="88" height="88" rx="22" fill="#0a5c47"/>
  <g transform="translate(144,446)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-16" y="-12" width="32" height="24" rx="4"/>
    <path d="M-16 -9 L0 4 L16 -9"/>
  </g>

  <!-- agent tile: megaphone (bottom-right) -->
  <rect x="712" y="410" width="88" height="88" rx="22" fill="#13221d" opacity="0.10" filter="url(#soft)"/>
  <rect x="712" y="402" width="88" height="88" rx="22" fill="#0d7a5e"/>
  <g transform="translate(756,446)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-15 -6 L7 -14 L7 14 L-15 6 Z"/>
    <path d="M12 -8 A10.5 10.5 0 0 1 12 8"/>
  </g>

  <!-- central card -->
  <rect x="320" y="140" width="260" height="300" rx="24" fill="#13221d" opacity="0.12" filter="url(#soft)"/>
  <rect x="320" y="130" width="260" height="300" rx="24" fill="#ffffff" stroke="#dcebe4" stroke-width="2"/>

  <!-- card header: check-tile logo + placeholder lines + score badge -->
  <rect x="344" y="152" width="30" height="30" rx="9" fill="#0d7a5e"/>
  <path d="M351 167 L357 173 L367 160.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="384" y="155" width="100" height="8" rx="4" fill="#dcebe4"/>
  <rect x="384" y="169" width="64" height="8" rx="4" fill="#dcebe4" opacity="0.7"/>
  <rect x="506" y="149" width="54" height="34" rx="17" fill="#0d7a5e"/>
  <text x="533" y="172" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">84</text>

  <line x1="344" y1="200" x2="556" y2="200" stroke="#dcebe4" stroke-width="1.5" opacity="0.8"/>

  <!-- sparkline -->
  <polyline points="344,252 366,240 388,246 410,228 432,234 456,218" fill="none" stroke="#0a5c47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="456" cy="218" r="3.5" fill="#0a5c47"/>

  <!-- stat pill with up arrow -->
  <rect x="492" y="212" width="64" height="46" rx="12" fill="#f4faf7" stroke="#dcebe4" stroke-width="2"/>
  <g fill="none" stroke="#0d7a5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M524 248 V226"/>
    <path d="M517 233 L524 226 L531 233"/>
  </g>

  <!-- rising bar chart -->
  <line x1="344" y1="396" x2="556" y2="396" stroke="#dcebe4" stroke-width="2" stroke-linecap="round"/>
  <rect x="350" y="354" width="24" height="42" rx="6" fill="#dcebe4"/>
  <rect x="385" y="336" width="24" height="60" rx="6" fill="#0d7a5e" opacity="0.45"/>
  <rect x="420" y="320" width="24" height="76" rx="6" fill="#0d7a5e" opacity="0.65"/>
  <rect x="455" y="302" width="24" height="94" rx="6" fill="#0d7a5e" opacity="0.85"/>
  <rect x="490" y="284" width="24" height="112" rx="6" fill="#0a5c47"/>
  <rect x="525" y="264" width="24" height="132" rx="6" fill="#f0b429"/>

  <!-- upward arrow over bars -->
  <g fill="none" stroke="#0d7a5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M356 344 C420 332 476 304 532 264"/>
    <path d="M518.2 266.5 L532 264 L525 276.2"/>
  </g>
</svg>
